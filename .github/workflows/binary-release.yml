name: KHive source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: khive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check release contents
        run: make check-release
      - name: Scan source for credentials
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="${RUNNER_TEMP}/khive-gitleaks"
          mkdir -p "$scanner_dir"
          cd "$scanner_dir"
          curl --fail --silent --show-error --location --output scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 "  scanner.tar.gz" }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf scanner.tar.gz gitleaks
          ./gitleaks dir --redact=100 --no-banner "$GITHUB_WORKSPACE"
      - run: make deps
      - name: Run focused tests in isolated Linux namespaces
        run: sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" python3 scripts/check-stability.py --local
      - run: make build-amd64 UPX=
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the validated source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="v$(python3 -c 'import json; print(json.load(open("web/package.json"))["version"])')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Refusing to publish an invalid release version' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "$version" existing-releases.txt; then
            echo "Release ${version} already exists; it will not be overwritten."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' > existing-tags.txt
          if grep -Fxq "$version" existing-tags.txt; then
            echo "Tag ${version} already exists; review its target before publishing." >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          body = text.split('\n## ', 1)[1].split('\n', 1)[1].split('\n## ', 1)[0].strip()
          body += '\n\n本次提供带版本标签的源码；编译与首次使用见仓库 README。未附加预编译程序或 Docker 部署文件。\n'
          Path('release-notes.md').write_text(body)
          PY
          gh release create "$version" --target "$GITHUB_SHA" --title "KHive ${version#v}" --notes-file release-notes.md --latest
