name: 功能建议
description: 描述使用需求和预期行为
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述使用场景，避免填写个人身份和凭据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式
